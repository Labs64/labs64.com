name: Build labs64.com

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Install gems (lockfile is stale, re-resolve to current github-pages)
      run: |
        rm -f Gemfile.lock
        bundle install --jobs 4 --retry 3
    - name: Build the site
      run: bundle exec jekyll build --future
